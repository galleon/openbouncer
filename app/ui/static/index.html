<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBouncer</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Self-hosted (no CDN) -- see vendor/katex-0.18.1/VENDORED.md. -->
    <link rel="stylesheet" href="vendor/katex-0.18.1/katex.min.css" />
  </head>
  <body data-nav="chat" data-page-title="Chat Tester">
    <main id="page-main">
      <form id="chat-form">
        <div class="row">
          <label class="field">
            <span>Model</span>
            <select id="model" required></select>
          </label>

          <label class="checkbox-field">
            <input type="checkbox" id="stream" checked />
            <span>Stream response</span>
          </label>
        </div>

        <fieldset id="guardrails-fieldset">
          <legend>
            <label class="checkbox-field">
              <input type="checkbox" id="guardrails-enabled" />
              <span>Enable guardrails</span>
            </label>
          </legend>

          <div class="row">
            <label class="field">
              <span>Guardrails config</span>
              <select id="guardrails-config" disabled></select>
            </label>

            <label class="field">
              <span>Preset</span>
              <select id="preset" disabled></select>
            </label>
          </div>
        </fieldset>

        <label class="field">
          <span>Message</span>
          <textarea
            id="prompt"
            rows="5"
            placeholder="Type a message..."
            required
          ></textarea>
        </label>

        <label class="field">
          <span>Image URL (optional)</span>
          <input
            type="url"
            id="image-url"
            placeholder="https://example.com/cat.png"
          />
        </label>

        <button type="submit" id="send">Send</button>
      </form>

      <section id="response-section">
        <div class="response-header">
          <h2>Response</h2>
          <span id="status" role="status"></span>
        </div>
        <div id="response"></div>
      </section>
    </main>

    <script src="vendor/katex-0.18.1/katex.min.js"></script>
    <!-- Self-hosted (no CDN) -- see vendor/markdown-it-15.0.0/VENDORED.md. -->
    <script src="vendor/markdown-it-15.0.0/markdown-it.min.js"></script>
    <script src="common.js"></script>
    <script src="shell.js"></script>
    <script src="app.js"></script>
  </body>
</html>
