models:
  # Local DGX deployment: BGE-M3 embeddings and Gemma-4 NVFP4 chat, each
  # served by its own vLLM OpenAI-compatible container (see the
  # vllm-bge-m3 / vllm-gemma4 services in docker-compose.yml, profile
  # "vllm"). vLLM ignores the bearer token unless the container is started
  # with --api-key, so api_key_env just needs to resolve to some non-empty
  # value -- e.g. `export UPSTREAM_VLLM_API_KEY=local`. If the gateway
  # itself runs outside that docker-compose network, replace the
  # vllm-bge-m3 / vllm-gemma4 hostnames below with localhost:8001 /
  # localhost:8002 (the host-mapped ports).
  - id: local/bge-m3
    upstream_model: BAAI/bge-m3
    base_url: http://vllm-bge-m3:8000/v1
    api_key_env: UPSTREAM_VLLM_API_KEY
    capabilities:
      - embeddings
    concurrency_limit: 8

  - id: local/gemma4-nvfp4
    upstream_model: nvidia/Gemma-4-26B-A4B-NVFP4
    base_url: http://vllm-gemma4:8000/v1
    api_key_env: UPSTREAM_VLLM_API_KEY
    capabilities:
      - chat
    concurrency_limit: 4
    # Optional, free-form -- see ModelEntry.sovereignty and
    # ensure_sovereignty_allowed() for how a key's required_sovereignty is
    # checked against these. Tags are whatever an operator's own compliance
    # framework calls them; this example just shows the shape.
    sovereignty:
      hosting: on-prem
      data_residency: EU
