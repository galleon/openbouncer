# Template for API key configuration. This file is NOT loaded automatically
# -- OpenBouncer only reads config/api_keys.yaml (or the path/content given
# by OPENBOUNCER_API_KEYS_CONFIG / OPENBOUNCER_API_KEYS_YAML). Copy this file
# to config/api_keys.yaml (or point OPENBOUNCER_API_KEYS_CONFIG at your own
# copy) and replace the example key below with your own.
#
# Generate a new key + its hash with:
#   python -c "import secrets, hashlib; k = 'sk-' + secrets.token_urlsafe(32); print('key:', k); print('key_hash:', hashlib.sha256(k.encode()).hexdigest())"
# Store the raw key ("key:") securely and give it to the client; only the
# hash ("key_hash:") is ever written to this file or held in memory.

keys:
