# Opt-in override that makes the admin API/UI (app/api/routes/admin.py,
# /ui/admin.html) actually able to persist changes. Layer it on top of the
# base file explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.admin.yml up --build
#
# Left out of docker-compose.yml itself so `docker compose up` stays exactly
# as it's always been -- read-only config/guardrails_configs mounts, no
# behavior change -- unless you deliberately opt into this file. The admin
# endpoints work without this override too (you can browse/list through
# them), they just can't save: PATCH requests fail with a clear
# key_store_not_file_backed / guardrails_config_invalid error instead of
# silently doing nothing.
#
# Before using this: the gateway container has no USER directive (runs as
# root), so any file it writes becomes root-owned on the host -- you'll
# likely need `sudo chown`/`chmod` afterward if you want to hand-edit
# config/api_keys.yaml or guardrails_configs/*/config.yml yourself again
# later.
services:
  gateway:
    volumes:
      - ./config:/app/config
      - ./guardrails_configs:/app/guardrails_configs
