services:
  gateway:
    build: .
    image: openbouncer:latest
    ports:
      # Loopback-only: the `caddy` service below is the intended path in from
      # outside the host (TLS + the only port meant to be forwarded/exposed
      # externally). Bound to 127.0.0.1 so this raw HTTP port isn't reachable
      # over the LAN or a public interface, just for local debugging
      # (`curl http://localhost:8000/...` from the host itself still works).
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      # Model registry: which of the 3 allowed public models are exposed
      # and how to reach their upstream. Defaults to the bundled
      # config/models.yaml (mounted below) if unset.
      MODEL_CONFIG_PATH: ${MODEL_CONFIG_PATH:-}

      # Guardrails: disabled | nemo_library | nemo_microservice
      GUARDRAILS_MODE: ${GUARDRAILS_MODE:-disabled}
      # Only used when GUARDRAILS_MODE=nemo_microservice -- base URL of a
      # separately-run NeMo Guardrails Microservice (see the `guardrails`
      # profile below for a docker-compose-managed example).
      NEMO_GUARDRAILS_BASE_URL: ${NEMO_GUARDRAILS_BASE_URL:-http://localhost:8000/v1}

      # Upstream model API key(s). All 3 bundled NVIDIA models share this one
      # (see config/models.yaml's api_key_env) since they're all served from
      # the same NVIDIA endpoint; add more UPSTREAM_*_API_KEY variables here
      # if you point config/models.yaml at additional providers.
      UPSTREAM_NVIDIA_API_KEY: ${UPSTREAM_NVIDIA_API_KEY:-}

      # Only used by the local/bge-m3 and local/gemma4-nvfp4 entries in
      # config/models.yaml (see the vllm-bge-m3 / vllm-gemma4 services
      # below). vLLM doesn't check the API key at all unless the container
      # is started with --api-key, so this just needs to resolve to *some*
      # non-empty value.
      UPSTREAM_VLLM_API_KEY: ${UPSTREAM_VLLM_API_KEY:-local}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API key auth (see README's Authentication section) -- points at the
      # file bind-mounted below. Left unset, every request gets 401.
      OPENBOUNCER_API_KEYS_CONFIG: /app/config/api_keys.yaml

      # Only used if the `redis` profile is enabled below; leave unset to
      # use OpenBouncer's built-in in-memory rate limiter instead.
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Read-write as of the admin UI (app/api/routes/admin.py): admin
      # edits (per-key allowed_guardrails_configs, guardrails config bullet
      # lists) are persisted by rewriting these files in place from inside
      # the container. Deliberate security-posture change from the
      # previous read-only mounts -- the container has no USER directive
      # (runs as root), so after the first admin write the touched file(s)
      # will be owned by root on the host, possibly needing `sudo` to
      # hand-edit afterward. Every admin write is also logged
      # (logger.info in app/api/routes/admin.py) for a trace of what
      # changed.
      - ./config:/app/config
      - ./guardrails_configs:/app/guardrails_configs
    restart: unless-stopped

  # TLS-terminating reverse proxy in front of `gateway` -- the only service
  # meant to be reachable from outside the host (e.g. forwarded through a
  # router/Freebox). Proxies to gateway:8000 over the internal docker
  # network, so gateway's own port binding above can stay loopback-only.
  #
  # Built from Dockerfile.caddy (not the stock caddy:2-alpine image) because
  # it bundles the caddy-dns/gandi plugin -- needed since ports 80/443 on
  # this network are already claimed by another box, so Caddy can't use the
  # normal HTTP-01/TLS-ALPN-01 ACME challenges (those are hardcoded to
  # ports 80/443 on the public IP, non-negotiable). DNS-01 instead proves
  # domain ownership via a TXT record through Gandi's API, so it works on
  # any port -- here mapped to external 8443.
  #
  # Required in a .env file:
  #   DOMAIN=your-subdomain.example.com   # must be on Gandi DNS
  #   GANDI_API_TOKEN=...                 # Gandi account -> Personal access tokens, DNS record permission for the domain
  # You still need to: point DOMAIN's A/AAAA record at this network's public
  # IP (ideally via dynamic DNS, since Free's IPv4 isn't static), and forward
  # external port 8443 -> this host's 8443 in Freebox OS.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "8443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to this box's public hostname, e.g. spark1.example.com}
      GANDI_API_TOKEN: ${GANDI_API_TOKEN:?set GANDI_API_TOKEN in .env -- Gandi account -> Personal access tokens}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
    restart: unless-stopped

  # Optional: distributed rate limiting shared across multiple gateway
  # replicas, instead of OpenBouncer's default per-process in-memory
  # limiter. Disabled by default -- start it explicitly with:
  #   docker compose --profile redis up
  # and set REDIS_URL=redis://redis:6379/0 (e.g. in a .env file) so the
  # gateway actually uses it.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Optional: local model serving on a DGX Spark via vLLM's OpenAI-compatible
  # server, matching the local/bge-m3 and local/gemma4-nvfp4 entries in
  # config/models.yaml. Disabled by default -- start explicitly with:
  #   docker compose --profile vllm up
  #
  # DGX Spark is a single GB10 chip (one Blackwell GPU, sm_121, ARM64 Grace
  # CPU, 128GB unified memory shared by CPU+GPU) -- NOT a multi-GPU DGX
  # server, so both services below intentionally target the same GPU 0.
  # Requires the NVIDIA Container Toolkit on the host.
  #
  # IMPORTANT: stock `vllm/vllm-openai:latest` does not run on GB10 -- its
  # CUDA 12.8 base is one minor version below what sm_121's FlashInfer JIT
  # needs (12.9+) and the engine crashes sizing the KV cache. VLLM_IMAGE
  # below defaults to NVIDIA's NGC vLLM image, which does support GB10 --
  # override the tag/pull a newer one in a .env file if needed:
  #   VLLM_IMAGE=nvcr.io/nvidia/vllm:26.06-py3
  #   HF_TOKEN=hf_...   # only needed if the model repo is gated
  #
  # NGC's nvcr.io/nvidia/vllm images use a pass-through entrypoint, so
  # `command:` below spells out the full `vllm serve <model> ...` -- unlike
  # the community vllm/vllm-openai image, whose entrypoint already *is*
  # `vllm serve` (drop the leading `vllm serve` from command: if you switch
  # to that image instead).
  #
  # gpu-memory-utilization on both services is kept low/moderate (rather
  # than vLLM's 0.9 default, which is known to OOM on DGX Spark even for a
  # single model) since it's a fraction of the *same* 128GB pool the host OS
  # and Grace CPU also draw from, not dedicated VRAM -- tune to taste.
  # Running both containers concurrently means they time-share the one GPU
  # (no MIG/MPS partitioning on this chip); fine for an embedding model +
  # chat model pair, but expect contention under simultaneous load.
  vllm-bge-m3:
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.06-py3}
    profiles: ["vllm"]
    command: >
      vllm serve BAAI/bge-m3
      --served-model-name BAAI/bge-m3
      --runner pooling
      --port 8000
      --gpu-memory-utilization 0.1
    ports:
      # Loopback-only -- vLLM ignores the bearer token unless started with
      # --api-key (not set here), so this must never be reachable from
      # outside the host. See the caddy/gateway note above.
      - "127.0.0.1:8001:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  # NVFP4 needs a vLLM build with NVFP4/ModelOpt support (see VLLM_IMAGE
  # note above). Adjust --quantization (or drop it to rely on autodetection
  # from the checkpoint's quant config) to match what your installed vLLM
  # version expects.
  vllm-gemma4:
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.06-py3}
    profiles: ["vllm"]
    command: >
      vllm serve nvidia/Gemma-4-26B-A4B-NVFP4
      --served-model-name nvidia/Gemma-4-26B-A4B-NVFP4
      --quantization modelopt
      --port 8000
      --gpu-memory-utilization 0.5
    ports:
      # Loopback-only -- same reasoning as vllm-bge-m3 above.
      - "127.0.0.1:8002:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  # Optional: platform-wide metrics -- Prometheus scrapes the gateway
  # (see app/api/routes/metrics.py) plus vLLM's and Caddy's own
  # already-built-in Prometheus endpoints, Grafana visualizes them.
  # Disabled by default -- start explicitly with:
  #   docker compose --profile observability up
  #
  # Requires a file at observability/gateway_admin_key containing a raw
  # is_admin: true API key (see config/api_keys.yaml) -- gitignored, not
  # committed. Prometheus's own config format doesn't support ${VAR}
  # substitution the way this compose file does, so the admin key has to
  # be a file, not an env var (see observability/prometheus.yml).
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/gateway_admin_key:/etc/prometheus/gateway_admin_key:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Bound to loopback like the gateway's own :8000 -- consistent with this
  # deployment's "only Caddy is externally reachable" posture. Use an SSH
  # tunnel, or add your own Caddy route later if you want it reachable
  # through the public domain.
  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  huggingface-cache:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
