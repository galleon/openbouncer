instructions:
  - type: general
    content: |
      Below is a conversation between a user and an assistant.

models:
  - type: main
    engine: openai
    model: nvidia/Gemma-4-26B-A4B-NVFP4
    api_key_env_var: UPSTREAM_VLLM_API_KEY
    parameters:
      base_url: http://vllm-gemma4:8000/v1
  - type: topic_guard
    engine: openai
    model: nvidia/Gemma-4-26B-A4B-NVFP4
    api_key_env_var: UPSTREAM_VLLM_API_KEY
    parameters:
      base_url: http://vllm-gemma4:8000/v1

rails:
  input:
    flows:
      - topic safety check input $model=topic_guard

# Edit the allowed-topics list below to match your deployment.
prompts:
  - task: topic_safety_check_input $model=topic_guard
    content: |
      You are an AI assistant restricted to a specific set of allowed topics.

      Allowed topics:
      - general knowledge questions
      - technology and software
      - science and mathematics

      Any other topic (e.g. legal advice, medical advice, financial advice,
      politics, or anything unrelated to the allowed topics above) is
      off-topic.
