# Scrapes the whole DGX Spark stack, not just the gateway: vLLM exposes
# Prometheus metrics out of the box (no config needed on its side), Caddy's
# /metrics comes from the dedicated :9090 listener in ../Caddyfile (not the
# admin API), and the gateway's /metrics is admin-key-gated (see
# app/api/routes/metrics.py).
#
# Note: Prometheus's own config format does NOT support ${VAR} environment
# substitution (a common gotcha, unlike docker-compose.yml) -- the admin
# key is read from a file instead (credentials_file), which Prometheus
# re-reads on every scrape so the key can rotate without a restart.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/gateway_admin_key
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: vllm-bge-m3
    static_configs:
      - targets: ["vllm-bge-m3:8000"]

  - job_name: vllm-gemma4
    static_configs:
      - targets: ["vllm-gemma4:8000"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:9090"]
